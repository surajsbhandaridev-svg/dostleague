# Render Blueprint. Both services build from the repo root (npm workspaces). A lockfile is recommended; npm install works with the supplied ZIP before one exists.
services:
  - type: web
    name: dostleague-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w backend
    startCommand: npm start -w backend
    healthCheckPath: /health
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: NODE_ENV, value: production }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: ADMIN_API_KEY, sync: false }
      - { key: SESSION_TOKEN_SECRET, generateValue: true }
  - type: web
    name: dostleague-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }
      - { key: VITE_SOCKET_URL, sync: false }
      - { key: VITE_SITE_URL, sync: false }
      - { key: VITE_ADS_ENABLED, value: "false" }
      - { key: VITE_ADS_SITE_APPROVED, value: "false" }
      - { key: VITE_ADS_PREVIEW, value: "false" }
      # After approval add in the Render dashboard: VITE_ADSENSE_CLIENT and the three VITE_ADSENSE_SLOT_GUIDE_* values, then redeploy.
